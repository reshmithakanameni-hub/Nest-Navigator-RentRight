# Local / single-server run:   docker compose up --build   ->  http://localhost:3000
# With automatic HTTPS (a real domain):  see docker-compose.https.yml and DEPLOYMENT.md
services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      BACKUP_KEEP: "7"
    volumes:
      - nn-data:/app/data
      - nn-backups:/app/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  nn-data:
  nn-backups:
