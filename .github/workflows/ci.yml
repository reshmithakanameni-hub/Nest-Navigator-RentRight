name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax checks and unit/integration tests (no install needed, no runtime dependencies)
        run: npm run check
  e2e:
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true   # browser journey; not yet run by the author, so it does not block the core checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  docker:
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true   # image smoke test; not yet run by the author
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t nestnavigator:ci .
      - name: Start the container and wait for the health check
        run: |
          docker run -d --name nn -p 3000:3000 nestnavigator:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:3000/api/health && exit 0; sleep 2; done
          docker logs nn; exit 1
